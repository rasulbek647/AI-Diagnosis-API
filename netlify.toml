# Netlify site: https://clever-mousse-90117c.netlify.app
# Repo: https://github.com/rasulbek647/AI-Diagnosis-API

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "https://ai-diagnosis-api.onrender.com/api/v1"
  VITE_DEMO = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
