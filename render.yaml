# Render Blueprint — backend only (frontend on Netlify).
# Dashboard: https://dashboard.render.com/web/srv-d826bbbtqb8s73caa5q0
# Public URL: https://ai-diagnosis-api.onrender.com

services:
  - type: web
    name: ai-diagnosis-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_HOURS
        value: "720"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "365"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        value: Main Admin
      - key: CORS_ORIGINS
        value: https://clever-mousse-90117c.netlify.app,http://localhost:5173,http://localhost:3000

databases:
  - name: medai-db
    databaseName: medai
    user: medai
