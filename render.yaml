# Render Blueprint — faqat backend (frontend Netlifyda).
# CORS_ORIGINS ga Netlify manzilini yozing: https://sizning-app.netlify.app
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ai-diagnosis
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        value: Main Admin
      # Vergul bilan bir nechta: https://app.netlify.app,http://localhost:5173
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: medai-db
    databaseName: medai
    user: medai
